<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحرير الموقع | شركة تنقيح</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Alexandria", sans-serif; min-height: 100vh;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #13211B, #1E3F2B 60%, #155235);
    color: #fff; text-align: center; padding: 24px;
  }
  .card { max-width: 480px; }
  img { height: 140px; margin-bottom: 28px; }
  h1 { font-size: 26px; margin-bottom: 12px; }
  p { color: rgba(255,255,255,.75); font-size: 15px; line-height: 1.9; margin-bottom: 28px; }
  a.btn {
    display: inline-block; background: #AD965F; color: #fff; text-decoration: none;
    padding: 15px 40px; border-radius: 12px; font-weight: 600; font-size: 16px;
    transition: all .25s;
  }
  a.btn:hover { background: #997F45; transform: translateY(-2px); }
  .hint { margin-top: 22px; font-size: 12.5px; color: rgba(255,255,255,.5); }
</style>
</head>
<body>
  <div class="card">
    <img src="../assets/img/logo-vertical-white.png" alt="شركة تنقيح">
    <h1>لوحة تحرير الموقع</h1>
    <p>من هنا تقدر تعدّل نصوص الموقع وخدماته وأرقام التواصل — التعديلات تُنشر تلقائيًا خلال دقيقة من الحفظ.</p>
    <a class="btn" href="https://app.pagescms.org/suliman1416s/tanqih-website">دخول لوحة التحرير</a>
    <p class="hint">تسجيل الدخول يتم بحساب GitHub المصرّح له فقط</p>
  </div>
</body>
</html>
