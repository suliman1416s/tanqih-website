process:
  kicker: "كيف نعمل"
  title: "آلية عملنا"
  steps:
    - title: "تواصل معنا"
      text: "عبر النموذج أو الواتساب أو الاتصال المباشر، وحدّد موضوعك باختصار."
    - title: "دراسة الحالة"
      text: "نستمع لك بعناية وندرس المستندات ونحدد الموقف القانوني بدقة."
    - title: "خطة العمل"
      text: "نقدّم لك خطة واضحة بالإجراءات والمدد والأتعاب قبل البدء."
    - title: "التنفيذ والمتابعة"
      text: "ننفّذ بالتزامٍ تام، مع تقارير دورية توضح مستجدات القضية أولًا بأول."

faq:
  kicker: "استفساراتك"
  title: "الأسئلة الشائعة"
  items:
    - q: "هل يمكنني الحصول على استشارة قانونية عن بُعد؟"
      a: "نعم، نقدّم الاستشارات القانونية حضوريًا في مقر الشركة بالرياض، أو عن بُعد عبر الهاتف والاتصال المرئي بما يناسبك."
    - q: "كيف تُحدَّد الأتعاب؟"
      a: "تُحدَّد الأتعاب بحسب طبيعة القضية أو الخدمة وحجم العمل المطلوب، ونلتزم بالإفصاح الكامل عن الأتعاب وتضمينها في اتفاقية مكتوبة قبل البدء بأي عمل."
    - q: "هل تضمنون سرّية المعلومات؟"
      a: "السرّية التامة التزام مهني ونظامي نتقيد به تجاه جميع عملائنا، فجميع ما تشاركه معنا من معلومات ومستندات محفوظ ولا يُطّلع عليه إلا فريق العمل المكلّف."
    - q: "هل تترافعون أمام جميع المحاكم؟"
      a: "نعم، نتولى الترافع والتقاضي أمام كافة المحاكم ولجان الفصل في المنازعات في المملكة، بموجب ترخيص المحاماة رقم 451933 الصادر من وزارة العدل."
    - q: "كيف أتابع مستجدات قضيتي؟"
      a: "نلتزم بتزويدك بتقارير دورية عن سير أعمالك وقضاياك، إضافة إلى إمكانية التواصل المباشر مع الفريق المكلّف في أي وقت خلال ساعات العمل."

consult:
  kicker: "جاهزون لخدمتك"
  title: "اطلب استشارتك الآن"
  text: "عبّئ النموذج وسيصلنا طلبك مباشرة عبر الواتساب، وسنعاود التواصل معك في أقرب وقت خلال ساعات العمل."
  points:
    - "ردّ سريع خلال ساعات العمل"
    - "سرّية تامة لجميع البيانات"
    - "وضوح كامل في الأتعاب قبل البدء"
  button: "إرسال الطلب عبر واتساب"
  note: "سيُفتح تطبيق واتساب برسالة جاهزة تحتوي بياناتك — راجعها ثم اضغط إرسال."

