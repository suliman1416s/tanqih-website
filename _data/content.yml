hero:
  title_line1: "شركة تنقيح للمحاماة"
  title_line2: "والاستشارات القانونية"
  lede: "نُقدّم الخدمات القانونية بجودة عالية وتعاملٍ احترافي — من الترافع أمام كافة المحاكم، إلى صياغة العقود واللوائح، والاستشارات القانونية، والتحكيم، والأوقاف."
  cta_primary: "اطلب استشارة الآن"
  cta_secondary: "استكشف خدماتنا"
  chips:
    - "جودة عالية"
    - "التزام بالمواعيد"
    - "تقارير دورية"
    - "فريق متخصص"

about:
  kicker: "من نحن"
  title: "عن شركة تنقيح"
  paragraphs:
    - "شركة سعودية متخصصة في تقديم الخدمات القانونية، من ترافعٍ قضائي أمام كافة المحاكم، وصياغة العقود واللوائح والاتفاقيات، والمراجعة القانونية، إضافةً إلى الاستشارات القانونية وخدمات الأوقاف والتحكيم في المنازعات."
    - "نعمل على تحقيق كل ذلك بجودة عالية وتعاملٍ احترافي مع عملائنا، وفق أعلى معايير المهنة وبما يتوافق مع الأنظمة واللوائح في المملكة العربية السعودية."
  points:
    - "جودة عالية في المخرجات القانونية"
    - "أداء الأعمال في وقتها المحدد دون تأخير"
    - "فريق عمل مميز ومتخصص"
    - "تقارير دورية توضح مستجدات أعمالكم"
  cards:
    - icon: eye
      title: "رؤيتنا"
      text: "الريادة في تقديم الخدمات القانونية."
    - icon: target
      title: "رسالتنا"
      text: "تقديم الخدمة القانونية باحترافية عالية وجودة مميزة."
    - icon: shield
      title: "قيمنا"
      text: "الأمانة، السرّية، الاحترافية، والالتزام."

